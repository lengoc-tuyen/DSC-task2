[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uit-legal-parser"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
rag = [
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "accelerate>=1.0",
]
quantization = ["bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["legal_parser", "legal_rag"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
